<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提出物チェッカー</title>
<style>
:root {
  --bg: #f4f5f7; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e2e5ea;
  --accent: #2563eb; --accent-soft: #e3ebff;
  --c-collect: #2563eb; --c-collect-bg: #eef3ff;
  --c-few: #b45309; --c-few-bg: #fff6e0;
  --c-over: #c62828; --c-over-bg: #fdecec;
  --c-done: #15803d; --c-done-bg: #e7f7ed;
  --on: #16a34a; --on-bg: #dcf5e4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13161c; --card: #1d2129; --text: #e7e9ee; --muted: #9aa1ad; --line: #2e333e;
    --accent: #7aa5ff; --accent-soft: #24304f;
    --c-collect: #8fb2ff; --c-collect-bg: #1d2740;
    --c-few: #fbbf5a; --c-few-bg: #3a2f17;
    --c-over: #ff8a8a; --c-over-bg: #3e1c1c;
    --c-done: #6ee39a; --c-done-bg: #173525;
    --on: #6ee39a; --on-bg: #1b3a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px;
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif; }
header { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line);
  padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav button { background: none; border: none; padding: 7px 11px; border-radius: 8px; color: var(--muted);
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
nav button.active { background: var(--accent-soft); color: var(--accent); }
main { max-width: 1200px; margin: 0 auto; padding: 14px 16px 40px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
.card h2 { font-size: 15px; margin: 0 0 10px; }
h3.sec { font-size: 14px; margin: 18px 0 8px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 8px; }
textarea { width: 100%; min-height: 110px; }
.btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--c-over); }
.btn.small { font-size: 12px; padding: 3px 8px; }
.btn:disabled { opacity: .45; cursor: default; }
.muted { color: var(--muted); font-size: 13px; }
.chk { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; cursor: pointer; }
.hidden { display: none !important; }
.empty { padding: 26px; text-align: center; color: var(--muted); }

/* status cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.tcard { text-align: left; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
  border-left: 6px solid var(--c-collect); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.tcard:hover { border-color: var(--accent); }
.tcard .top { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.tcard .name { font-weight: 700; font-size: 15px; }
.tcard .count { font-size: 13px; } .tcard .count b { font-size: 20px; }
.tcard .miss { font-size: 13px; }
.tcard .meta { font-size: 12px; color: var(--muted); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.st-collect { border-left-color: var(--c-collect); } .b-collect { background: var(--c-collect-bg); color: var(--c-collect); }
.st-few { border-left-color: var(--c-few); } .b-few { background: var(--c-few-bg); color: var(--c-few); }
.st-over { border-left-color: var(--c-over); } .b-over { background: var(--c-over-bg); color: var(--c-over); }
.st-done { border-left-color: var(--c-done); } .b-done { background: var(--c-done-bg); color: var(--c-done); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > div { height: 100%; background: currentColor; }
.legend { display: flex; gap: 6px; flex-wrap: wrap; }

/* check grid */
.tablewrap { overflow: auto; max-height: calc(100vh - 260px); border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
table.grid { border-collapse: separate; border-spacing: 0; font-size: 13px; }
table.grid th, table.grid td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; text-align: center; }
table.grid thead th { position: sticky; top: 0; background: var(--card); z-index: 2; padding: 6px 4px; min-width: 76px; max-width: 120px; vertical-align: bottom; }
table.grid .sticky { position: sticky; left: 0; background: var(--card); z-index: 1; padding: 0 8px; text-align: left; white-space: nowrap; }
table.grid thead .sticky { z-index: 3; }
.th-name { font-weight: 700; font-size: 12px; line-height: 1.25; word-break: break-all; }
.th-sub { font-size: 11px; color: var(--muted); font-weight: 400; }
.cell { width: 100%; min-width: 76px; height: 34px; border: none; background: transparent; font: inherit; font-size: 17px;
  font-weight: 700; color: var(--on); cursor: pointer; }
.cell.on { background: var(--on-bg); }
.cell.late { background: var(--c-over-bg); }
.cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
.quick input { width: 90px; font-size: 18px; text-align: center; }
.lastmsg { font-size: 13px; min-height: 1.3em; }

/* call view */
.callrow { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--line); }
.callrow .who { font-weight: 700; min-width: 70px; }
.callrow .what { flex: 1; }
.callrow .n { font-size: 12px; color: var(--c-over); white-space: nowrap; }
.note { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 10px; margin: 6px 0 10px; }

/* print preview */
.pages { display: flex; flex-direction: column; gap: 16px; align-items: center; }
.page { background: #fff; color: #000; width: 210mm; min-height: 297mm; padding: 14mm 12mm; box-shadow: 0 1px 6px rgba(0,0,0,.18); font-size: 12px; }
.page h2 { font-size: 18px; margin: 0 0 4px; }
.page .sub { font-size: 11px; color: #555; margin-bottom: 8px; }
.page table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.page th, .page td { border: 1px solid #555; padding: 2px 3px; text-align: center; height: 18px; overflow: hidden; }
.page th { font-size: 10px; font-weight: 600; background: #f0f0f0; word-break: break-all; }
.page td.miss { background: #eee; }
.page .legendp { font-size: 10px; margin-top: 6px; color: #333; }
.slip { border: 1px dashed #777; border-radius: 6px; padding: 10px 12px; margin-bottom: 6mm; height: 59mm; overflow: hidden; }
.slip h3 { margin: 0 0 4px; font-size: 15px; }
.slip ul { margin: 6px 0; padding-left: 18px; font-size: 13px; }
.slip .foot { font-size: 11px; color: #444; }
@page { size: A4; margin: 0; }
@media print {
  body { background: #fff; }
  header, .noprint, main > section:not(#view-print), .toast, #modeDlg { display: none !important; }
  main { padding: 0; max-width: none; }
  .pages { gap: 0; display: block; }
  .page { box-shadow: none; page-break-after: always; break-after: page; margin: 0; }
  .page:last-child { page-break-after: auto; break-after: auto; }
}

/* misc */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
.toast.show { opacity: .94; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.dialog { background: var(--card); border-radius: 14px; padding: 20px; max-width: 460px; width: 100%; }
.dialog h2 { margin: 0 0 6px; font-size: 18px; }
.choice { display: block; width: 100%; text-align: left; margin-top: 10px; padding: 12px 14px; }
.choice b { display: block; font-size: 15px; }
table.list { border-collapse: collapse; width: 100%; font-size: 13px; }
table.list th, table.list td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: middle; }
.help h3 { font-size: 15px; margin: 18px 0 6px; }
.help ol, .help ul { padding-left: 22px; margin: 4px 0; }
.help li { margin: 3px 0; }
#loading { padding: 60px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header class="noprint">
  <h1>提出物チェッカー</h1>
  <span id="syncState" class="muted hidden" style="margin-left:auto;order:3"></span>
  <button class="btn small hidden" id="btnRefresh" style="order:4" title="ほかの端末で入力した内容を読み込みます">↻ 最新に更新</button>
  <nav id="nav">
    <button data-view="status">回収状況</button>
    <button data-view="check">チェック入力</button>
    <button data-view="call">声かけビュー</button>
    <button data-view="print">印刷プレビュー</button>
    <button data-view="tasks">提出物</button>
    <button data-view="help">使い方</button>
  </nav>
</header>
<main>
  <div id="loading">読み込んでいます…</div>
  <section id="view-status" class="hidden"></section>
  <section id="view-check" class="hidden"></section>
  <section id="view-call" class="hidden"></section>
  <section id="view-print" class="hidden"></section>
  <section id="view-tasks" class="hidden"></section>
  <section id="view-help" class="hidden"></section>
</main>
<div id="modeDlg" class="overlay hidden">
  <div class="dialog">
    <h2>どちらの使い方に近いですか？</h2>
    <p class="muted">あとから「提出物」→「クラス設定」で変更できます。</p>
    <button class="btn choice" data-mode="single"><b>1クラスで使う</b><span class="muted">担任クラスなど、1クラスの提出物を管理します</span></button>
    <button class="btn choice" data-mode="multi"><b>複数クラスで使う</b><span class="muted">教科担任として、担当する複数クラスを行き来します</span></button>
    <button class="btn choice" data-mode="sample"><b>サンプルで試してみる</b><span class="muted">架空の3クラスと英語の提出物で画面を確認します（あとで初期化できます）</span></button>
    <p class="muted" id="storageNote" style="margin:14px 0 0"></p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== 動作環境 =====
// Apps Script（スプレッドシート）上ではシートに保存し、それ以外ではこの端末のブラウザに保存する。
const IS_GAS = typeof google !== 'undefined' && !!(google.script && google.script.run);
const LS_KEY = 'teishutsu-checker-v1';
const MAX_CLASSES = 10, MAX_STUDENTS = 45;
const SUGGEST = ['ワークブック', '単語テスト直し', '単語ノート', '英作文', '予習ノート', '文法プリント', '音読カード',
  'リスニング課題', 'スピーキング課題（録音）', '多読記録', '模試の解き直し', '英検過去問', '長期休業課題', '振り返りシート'];
const ST_LABEL = { collect: '回収中', few: 'あと5人以下', over: '締切超過', done: '全員提出' };

let state = emptyState();
let ui = {
  view: 'status', cls: null,
  sort: 'due', filterCls: '', hideDone: false,
  chkHideDone: false, onlyMissing: false, quickTask: null, lastMsg: '', focusQuick: false,
  callCls: '', overdueOnly: false, mailSubject: '提出物の確認のお願い',
  printType: 'class', printCls: null, printStu: 'all', printNames: false, blankCols: 10, blankTitle: '',
  editing: null, classDraft: null, openRoster: null,
};
let undoStack = [];
let copyTexts = [];

function emptyState() { return { mode: '', classes: [], tasks: [], checks: {} }; }

// ===== 共通 =====
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000); }
function fmtDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function todayStr() { return fmtDate(new Date()); }
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return fmtDate(d); }
function dayDiff(a, b) { const p = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 86400000); }
function md(s) { if (!s) return ''; const [, m, d] = s.split('-'); return `${+m}/${+d}`; }
function newId() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function getCls(name) { return state.classes.find((c) => c.name === name); }
function activeClasses() { return state.mode === 'single' ? state.classes.slice(0, 1) : state.classes; }
function tasksOf(clsName) { return state.tasks.filter((t) => t.classes.includes(clsName)).sort((a, b) => a.created - b.created); }
function isChecked(id, cls, no) { return !!(state.checks[id] && state.checks[id][cls] && state.checks[id][cls][no]); }
function missingNos(t, c) { const r = []; for (let n = 1; n <= c.count; n++) if (!isChecked(t.id, c.name, n)) r.push(n); return r; }
function nosText(arr, max) {
  if (!arr.length) return 'なし';
  if (max && arr.length > max) return arr.slice(0, max).join('・') + `番 ほか${arr.length - max}人`;
  return arr.join('・') + '番';
}
function stuName(c, no) { return (c.names || [])[no - 1] || ''; }
function stuEmail(c, no) { return (c.emails || [])[no - 1] || ''; }
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
// 個人別の用紙とメールで共通の文面
const MSG_INTRO = 'まだ確認できていない提出物です。';
const MSG_FOOT = '提出したら先生に声をかけてください。行き違いで提出済みの場合も教えてください。提出できない場合は放課後残ってやっていってください。';
function taskLine(t) { return t.name + (t.due ? `（締切 ${md(t.due)}）` : ''); }
function mailFor(c, no, miss, subject) {
  const body = `${c.name}　${stuLabel(c, no)}さんへ\n\n` +
    `${md(todayStr())}現在、${MSG_INTRO}\n\n` +
    miss.map((t) => '・' + taskLine(t)).join('\n') + '\n\n' +
    MSG_FOOT + '\n';
  return { no, to: stuEmail(c, no), subject: `${subject}（${c.name} ${no}番）`, body };
}
function stuLabel(c, no) { const nm = stuName(c, no); return nm ? `${no}番 ${nm}` : `${no}番`; }
function isOverdue(t) { return !!t.due && t.due < todayStr(); }
function dueText(t) {
  if (!t.due) return '締切なし';
  const d = dayDiff(todayStr(), t.due);
  if (d > 0) return `締切 ${md(t.due)}（あと${d}日）`;
  if (d === 0) return `今日締切`;
  return `締切 ${md(t.due)}（${-d}日超過）`;
}
function toldText(t) {
  if (!t.told) return '';
  const d = dayDiff(t.told, todayStr());
  return d >= 0 ? `伝えて${d}日` : `${md(t.told)}に伝える予定`;
}
function cardInfo(t, c) {
  const miss = missingNos(t, c);
  let st = 'collect';
  if (!miss.length) st = 'done'; else if (isOverdue(t)) st = 'over'; else if (miss.length <= 5) st = 'few';
  return { t, c, miss, done: c.count - miss.length, st };
}
function classOptions(selected, withAll) {
  return (withAll ? `<option value="">すべてのクラス</option>` : '') +
    activeClasses().map((c) => `<option value="${esc(c.name)}"${c.name === selected ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
}
function ensureCls() {
  const cs = activeClasses();
  if (!cs.find((c) => c.name === ui.cls)) ui.cls = cs[0] ? cs[0].name : null;
  return getCls(ui.cls);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('コピーしました'); return; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('コピーしました'); } catch (e) { prompt('コピーしてください', text); }
  ta.remove();
}

// ===== 保存（ブラウザ or スプレッドシート） =====
function gas(fn, ...args) {
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
}
function loadLocal() {
  try { const d = JSON.parse(localStorage.getItem(LS_KEY)); if (d && Array.isArray(d.classes)) return d; } catch (e) {}
  return emptyState();
}
const LS_BACKUP = 'teishutsu-checker-lastbackup';
function lastBackupDays() {
  try { const t = +localStorage.getItem(LS_BACKUP); return t ? Math.floor((Date.now() - t) / 86400000) : null; } catch (e) { return null; }
}
function backupBanner() {
  if (IS_GAS || !state.tasks.length) return '';
  const d = lastBackupDays();
  if (d !== null && d < 14) return '';
  return `<div class="card noprint" style="border-color:var(--c-few);background:var(--c-few-bg)">
    <div class="row" style="justify-content:space-between"><span style="font-size:13px">データはこのブラウザの中だけに保存されています。${d === null ? 'まだバックアップがありません。' : `最後のバックアップから${d}日たちました。`}端末の故障やブラウザのデータ消去に備えて、「提出物」画面の下にある「バックアップを保存」をおすすめします。</span>
    <button class="btn small" data-go="tasks">バックアップへ</button></div></div>`;
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { toast('この端末に保存できませんでした'); }
}
function normalize(s) {
  s = Object.assign(emptyState(), s || {});
  s.classes = (s.classes || []).map((c) => {
    const count = Math.max(1, Math.min(MAX_STUDENTS, parseInt(c.count, 10) || 1));
    const names = Array.from({ length: count }, (_, i) => String((c.names || [])[i] || '').trim());
    const emails = Array.from({ length: count }, (_, i) => String((c.emails || [])[i] || '').trim());
    return { name: String(c.name).trim(), count, names, emails, lastMail: c.lastMail || null };
  });
  s.tasks = (s.tasks || []).map((t) => ({ id: t.id, name: t.name, classes: t.classes || [], told: t.told || '', due: t.due || '', created: Number(t.created) || 0 }));
  s.checks = s.checks || {};
  return s;
}
let pending = 0;
function showSync() {
  if (!IS_GAS) return;
  const el = $('#syncState');
  el.classList.remove('hidden');
  el.textContent = pending ? '保存中…' : '✓ 保存済み';
}
async function persist(gasFn, ...args) {
  if (!IS_GAS) { saveLocal(); return; }
  pending++; showSync();
  try { await gas(gasFn, ...args); }
  catch (e) { toast('保存に失敗しました：' + (e && e.message || e)); pending--; await reload(); return; }
  pending--; showSync();
}
async function reload(quiet) {
  if (IS_GAS && quiet) { $('#syncState').textContent = '更新中…'; }
  try { state = normalize(IS_GAS ? await gas('getData') : loadLocal()); }
  catch (e) {
    if (quiet) { toast('最新の内容を読み込めませんでした'); showSync(); return; }
    $('#loading').textContent = '読み込みに失敗しました：' + (e && e.message || e); $('#loading').classList.remove('hidden'); return;
  }
  // 入力途中の画面はそのままにする
  if (quiet && ui.view === 'tasks' && (ui.editing || ui.openRoster !== null)) { showSync(); return; }
  if (quiet) ui.classDraft = null;
  render(); showSync();
}
// ほかの端末で入力した内容を、画面に戻ってきたときに読み込む
if (IS_GAS) {
  $('#btnRefresh').classList.remove('hidden');
  $('#btnRefresh').onclick = () => { if (!pending) reload(true); };
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 30000 && !pending) reload(true);
  });
}

function setCheck(cls, id, no, on, recordUndo = true) {
  const prev = isChecked(id, cls, no);
  if (prev === on) return;
  if (recordUndo) undoStack.push({ cls, id, no, prev });
  if (undoStack.length > 200) undoStack.shift();
  state.checks[id] = state.checks[id] || {};
  state.checks[id][cls] = state.checks[id][cls] || {};
  if (on) state.checks[id][cls][no] = true; else delete state.checks[id][cls][no];
  persist('setCheck', cls, id, no, on);
}
function upsertTask(t) {
  const i = state.tasks.findIndex((x) => x.id === t.id);
  if (i >= 0) state.tasks[i] = t; else state.tasks.push(t);
  persist('saveTask', t);
}
function removeTask(id) {
  state.tasks = state.tasks.filter((t) => t.id !== id);
  delete state.checks[id];
  undoStack = undoStack.filter((u) => u.id !== id);
  persist('deleteTask', id);
}
async function saveClasses(list) {
  if (IS_GAS) {
    try { state = normalize(await gas('saveClasses', list)); }
    catch (e) { toast('保存に失敗しました：' + (e && e.message || e)); return false; }
  } else {
    const keep = new Set(list.map((c) => c.oldName).filter(Boolean));
    const removed = state.classes.map((c) => c.name).filter((n) => !keep.has(n));
    for (const t of state.tasks) {
      t.classes = t.classes.filter((n) => !removed.includes(n));
      for (const c of list) if (c.oldName && c.oldName !== c.name) t.classes = t.classes.map((n) => n === c.oldName ? c.name : n);
    }
    for (const id in state.checks) {
      const old = state.checks[id], next = {};
      for (const c of list) if (c.oldName && old[c.oldName]) next[c.name] = old[c.oldName];
      state.checks[id] = next;
    }
    state.classes = list.map((c) => ({ name: c.name, count: c.count, names: c.names, emails: c.emails }));
    state = normalize(state); saveLocal();
  }
  undoStack = [];
  return true;
}
async function importState(s) {
  s = normalize(s);
  if (IS_GAS) {
    try { state = normalize(await gas('importState', s)); }
    catch (e) { toast('失敗しました：' + (e && e.message || e)); return; }
  } else { state = s; saveLocal(); }
  undoStack = []; ui.classDraft = null; ui.cls = null; ui.lastMsg = '';
}
function setMode(mode) {
  state.mode = mode; ui.classDraft = null;
  persist('setMode', mode);
}

// ===== サンプル =====
function buildSample() {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const classes = [{ name: '2年1組', count: 38 }, { name: '2年2組', count: 40 }, { name: '2年3組', count: 39 }];
  const all = classes.map((c) => c.name);
  const base = Date.now() - 100000;
  const tasks = [
    { name: 'Lesson 4 ワークブック', classes: all, told: addDays(-7), due: todayStr(), rate: 0.86 },
    { name: '英作文（My Future Dream）', classes: ['2年1組', '2年2組'], told: addDays(-10), due: addDays(-2), rate: 0.93 },
    { name: '単語テスト直し', classes: all, told: addDays(-2), due: addDays(3), rate: 0.55 },
    { name: '音読カード（10月）', classes: ['2年3組'], told: addDays(-14), due: addDays(-1), rate: 1 },
  ].map((t, i) => Object.assign(t, { id: 'sample' + i, created: base + i }));
  const checks = {};
  for (const t of tasks) {
    checks[t.id] = {};
    for (const cn of t.classes) {
      const c = classes.find((x) => x.name === cn); checks[t.id][cn] = {};
      for (let n = 1; n <= c.count; n++) if (rnd() < t.rate) checks[t.id][cn][n] = true;
    }
    delete t.rate;
  }
  return { mode: 'multi', classes, tasks, checks };
}

// ===== チェック入力 =====
function renderCheck() {
  const el = $('#view-check');
  const ns = needSetup(); if (ns) { el.innerHTML = ns; return; }
  const c = ensureCls();
  const allTasks = tasksOf(c.name);
  if (!allTasks.find((t) => t.id === ui.quickTask)) ui.quickTask = allTasks[0] ? allTasks[0].id : null;
  let ts = ui.chkHideDone ? allTasks.filter((t) => missingNos(t, c).length) : allTasks;
  const hasNames = c.names.some(Boolean);
  let rows = '';
  for (let n = 1; n <= c.count; n++) {
    if (ui.onlyMissing && ts.every((t) => isChecked(t.id, c.name, n))) continue;
    rows += `<tr><td class="sticky"><b>${n}</b>${hasNames ? ` <span class="muted">${esc(stuName(c, n))}</span>` : ''}</td>` +
      ts.map((t) => {

        return `<td><button class="cell${on ? ' on' : ''}${!on && isOverdue(t) ? ' late' : ''}" data-id="${t.id}" data-no="${n}" aria-label="${n}番 ${esc(t.name)}">${on ? '✓' : ''}</button></td>`;
      }).join('') + '</tr>';
  }
  el.innerHTML = `
    <div class="card">
      <div class="row">
        ${state.mode === 'multi' ? `<label class="f">クラス<select id="ckCls">${classOptions(c.name)}</select></label>` : `<b>${esc(c.name)}</b>`}

      </div>
    </div>
    ${allTasks.length ? `
    <div class="card quick">
      <div class="row">
        <b style="font-size:14px">番号で入力</b>
        <select id="qTask">${allTasks.map((t) => `<option value="${t.id}"${t.id === ui.quickTask ? ' selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
        <input id="qNo" inputmode="numeric" autocomplete="off" placeholder="番号">
        <span class="muted">番号を入れて Enter。続けて次の番号を入力できます。</span>
      </div>
      <div class="lastmsg" id="qMsg">${ui.lastMsg}</div>
    </div>
    <div class="tablewrap">
      <table class="grid">
        <thead><tr><th class="sticky">番号${hasNames ? '・氏名' : ''}</th>${ts.map((t) => {
          const m = missingNos(t, c).length;
          return `<th><div class="th-name">${esc(t.name)}</div><div class="th-sub">${c.count - m}/${c.count}・${t.due ? '〆' + md(t.due) : '締切なし'}</div></th>`;
        }).join('')}</tr></thead>

      </table>
    </div>
    <p class="muted">マスを押すと ✓（提出）になり、もう一度押すと外れます。赤いマスは締切を過ぎた未提出です。</p>`
    : `<div class="card empty">このクラスが対象の提出物はまだありません。<br><br><button class="btn primary" data-go="tasks" data-add="1">＋ 提出物を追加</button></div>`}`;

  if ($('#ckCls')) $('#ckCls').onchange = (e) => { ui.cls = e.target.value; ui.lastMsg = ''; render(); };
  $('#ckHide').onchange = (e) => { ui.chkHideDone = e.target.checked; render(); };
  $('#ckOnly').onchange = (e) => { ui.onlyMissing = e.target.checked; render(); };
  $('#ckUndo').onclick = () => {
    const u = undoStack.pop(); if (!u) return;
    setCheck(u.cls, u.id, u.no, u.prev, false);

    if (u.cls !== ui.cls && getCls(u.cls)) ui.cls = u.cls;

  if (tbody) tbody.addEventListener('click', (e) => {
    const b = e.target.closest('.cell'); if (!b) return;
    const no = +b.dataset.no, id = b.dataset.id;
    const sx = $('.tablewrap').scrollLeft, sy = $('.tablewrap').scrollTop;

// ===== メールで知らせる =====
let mailPlans = {};
function mailCardHtml(c, ts) {
  const targets = [], noMail = [];
  for (let n = 1; n <= c.count; n++) {
    const miss = ts.filter((t) => !isChecked(t.id, c.name, n));
    if (!miss.length) continue;
    if (EMAIL_RE.test(stuEmail(c, n))) targets.push({ n, miss }); else noMail.push(n);
  }
  mailPlans[c.name] = { c, targets, noMail };
  const registered = c.emails.filter(Boolean).length;
  const last = c.lastMail ? `前回の送信：${new Date(c.lastMail.at).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}（${c.lastMail.sent}人）` : 'まだ送信していません';
  return `<div class="callrow" style="align-items:center">
    <div class="who">${esc(c.name)}</div>
    <div class="what">送信対象 <b>${targets.length}人</b>${noMail.length ? `　<span class="muted">メール未登録のため送れない人：${nosText(noMail, 12)}</span>` : ''}
      <div class="muted">登録済み ${registered}/${c.count}人・${last}</div></div>
    <button class="btn small" data-mprev="${esc(c.name)}"${targets.length ? '' : ' disabled'}>文面を確認</button>
    <button class="btn small primary" data-msend="${esc(c.name)}"${targets.length ? '' : ' disabled'}>メールを送る</button></div>`;
}
function mailSectionHtml(classes, cards) {
  if (!IS_GAS) return `<div class="card"><h2>メールで知らせる</h2><p class="muted" style="margin:0">メールの一斉送信は、<a href="setup.html" target="_blank" rel="noopener">Googleアカウントで同期する版</a>でだけ使えます。</p></div>`;
  const anyMail = classes.some((c) => c.emails.some(Boolean));
  return `<div class="card">
    <h2>メールで知らせる</h2>
    ${anyMail ? `
    <div class="row" style="margin-bottom:6px"><label class="f">件名<input id="mSubject" value="${esc(ui.mailSubject)}" style="min-width:260px"></label></div>
    <p class="muted" style="margin:4px 0 6px">未提出がある生徒一人ひとりに、本人の未提出だけを書いたメールを、あなたのGmailから送ります（個人別の用紙と同じ文面です）。${ui.overdueOnly ? '<b>「締切を過ぎた提出物だけ」がオンなので、締切を過ぎた提出物だけを知らせます。</b>' : ''}</p>
    ${cards.join('')}
    <div id="mPreview"></div>`
    : '<p class="muted" style="margin:0">メールアドレスがまだ登録されていません。「提出物」→「クラス設定」の「名前・メール」から、生徒のGoogleアカウントのメールアドレスを登録してください。</p>'}
  </div>`;
}
function bindMail(el) {
  if ($('#mSubject')) $('#mSubject').onchange = (e) => { ui.mailSubject = e.target.value.trim() || '提出物の確認のお願い'; };
  el.querySelectorAll('[data-mprev]').forEach((b) => b.onclick = () => {
    const plan = mailPlans[b.dataset.mprev]; const t = plan.targets[0];
    const m = mailFor(plan.c, t.n, t.miss, ui.mailSubject);
    $('#mPreview').innerHTML = `<div class="note" style="white-space:pre-wrap;margin-top:10px"><b>宛先：</b>${esc(m.to)}\n<b>件名：</b>${esc(m.subject)}\n\n${esc(m.body)}</div><p class="muted">（1人目の例です。生徒ごとに、その生徒の未提出だけが書かれます。）</p>`;
  });
  el.querySelectorAll('[data-msend]').forEach((b) => b.onclick = async () => {
    const plan = mailPlans[b.dataset.msend];
    const mails = plan.targets.map((t) => mailFor(plan.c, t.n, t.miss, ui.mailSubject));
    if (!mails.length) return;
    let msg = `${plan.c.name}の${mails.length}人に、一人ずつメールを送ります。\n件名：${mails[0].subject.replace(/（.*）$/, '')}`;
    if (plan.noMail.length) msg += `\n\nメール未登録の${plan.noMail.length}人（${nosText(plan.noMail, 15)}）には送られません。`;
    if (plan.c.lastMail && Date.now() - plan.c.lastMail.at < 3600000) msg += '\n\n※1時間以内にこのクラスへ送信しています。二重送信にご注意ください。';
    if (!confirm(msg + '\n\n送信しますか？')) return;
    b.disabled = true; b.textContent = '送信中…';
    try {
      const r = await gas('sendReminders', plan.c.name, mails);
      plan.c.lastMail = r.lastMail;
      alert(`${r.sent}人に送信しました。` + (r.failed.length ? `\n\n送信できなかった人：\n` + r.failed.map((f) => `${f.no}番 ${f.to}：${f.error}`).join('\n') : '') +
        `\n\n今日あと${r.remaining}通まで送れます。送信記録はスプレッドシートの「メール送信記録」シートにあります。`);
    } catch (e) {
      alert('送信できませんでした：' + (e && e.message || e));
    }
    render();
  });
}

function renderPrint() {

  } else {
    const cols = Math.max(1, Math.min(16, +ui.blankCols || 10));
    pages = `<div class="page"><h2>${esc(ui.blankTitle || c.name + ' 提出物チェック表')}</h2><div class="sub">${esc(c.name)}　　月　　日〜</div>
      <table><thead><tr><th style="width:34px">番号</th>${hasNames && ui.printNames ? '<th style="width:90px">氏名</th>' : ''}${'<th style="height:52px"></th>'.repeat(cols)}</tr></thead><tbody>
      ${Array.from({ length: c.count }, (_, i) => `<tr><td>${i + 1}</td>${hasNames && ui.printNames ? `<td style="text-align:left">${esc(stuName(c, i + 1))}</td>` : ''}${'<td></td>'.repeat(cols)}</tr>`).join('')}
      </tbody></table></div>`;
  }
  el.innerHTML = `
    <div class="card noprint">
      <div class="row" style="align-items:flex-end">
        <label class="f">内容<select id="pType">
          <option value="class">クラス別（掲示用）</option><option value="personal">個人別（本人に渡す）</option><option value="blank">白紙のチェック表</option>

        ${state.mode === 'multi' ? `<label class="f">クラス<select id="pCls">${classOptions(c.name)}</select></label>` : ''}

        ${ui.printType === 'blank' ? `<label class="f">列の数<input id="pCols" type="number" min="1" max="16" value="${ui.blankCols}" style="width:70px"></label>

}

// 名簿の1行（「番号」「氏名」「メール」をタブ・カンマ区切りで。番号は省略可、氏名・メールは空欄可）
function parseRosterLine(line) {
  let parts = line.split(/\t|,|，/).map((s) => s.trim());
  if (parts.length === 1) {
    const t = parts[0].split(/\s+/).filter(Boolean);
    const at = t.findIndex((x) => x.includes('@'));
    if (at < 0) return { name: parts[0], email: '' };
    return { name: t.filter((_, i) => i !== at).join(' '), email: t[at].replace(/^mailto:/i, '') };
  }
  if (/^\d+$/.test(parts[0])) parts = parts.slice(1);
  let name = parts[0] || '', email = parts.slice(1).join('').trim();
  if (!email && name.includes('@')) { email = name; name = ''; }
  return { name, email: email.replace(/^mailto:/i, '') };
}

  };
  if ($('#dRestore')) $('#dRestore').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.classes) || !Array.isArray(d.tasks)) throw new Error();
        if (!confirm('今のデータを、バックアップの内容で置き換えます。よろしいですか？')) return;
        await importState(d); toast('復元しました'); render();
      } catch (err) { alert('バックアップファイルを読み込めませんでした'); }
    };
    r.readAsText(f);
  };
  $('#dSample').onclick = async () => {
    if ((state.classes.length || state.tasks.length) && !confirm('今のデータを消して、サンプルデータを入れます。よろしいですか？')) return;
    await importState(buildSample()); ui.view = 'status'; toast('サンプルデータを入れました'); render();
  };
  $('#dReset').onclick = async () => {
    if (!confirm('すべてのクラス・提出物・チェック記録を消して初期化します。元に戻せません。よろしいですか？')) return;
    await importState(Object.assign(emptyState(), { mode: state.mode })); toast('初期化しました'); render();
  };
}

// ===== 起動 =====
document.querySelectorAll('#modeDlg [data-mode]').forEach((b) => b.onclick = async () => {
  if (b.dataset.mode === 'sample') { await importState(buildSample()); ui.view = 'status'; render(); return; }
  setMode(b.dataset.mode);
  if (!state.classes.length) { ui.view = 'tasks'; toast('まず、クラス名と人数を登録してください'); }
  render();
});
$('#storageNote').innerHTML = IS_GAS
  ? 'データはあなたのGoogleドライブのスプレッドシートに保存されます。同じGoogleアカウントなら、どの端末からでも同じデータを使えます。'
  : 'この画面で入力したデータは、この端末のこのブラウザの中だけに保存されます。複数の端末で使いたい場合は <a href="setup.html" target="_blank" rel="noopener">Googleアカウントで同期する設定</a> をしてください。';
reload();
